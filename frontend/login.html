<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - JoelMart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #131921, #37475a);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 400px;
            max-width: 90%;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            color: #ff9900;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #ff9900;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background-color: #ff9900;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-button:hover {
            background-color: #e68a00;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .register-text {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .register-text a {
            color: #0066c0;
            text-decoration: none;
            font-weight: bold;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #0066c0;
            text-decoration: none;
        }

        @media (max-width: 500px) {
            .login-container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            JoelMart
        </div>

        <h2 class="title">
            Login to Your Account
        </h2>

        <form id="loginForm">

            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password" 
                    required
                >

            </div>


            <!-- Role -->
            <div class="form-group">

                <label for="role">
                    Login As
                </label>

                <select id="role" name="role" required>

                    <option value="">
                        Select Role
                    </option>

                    <option value="buyer">
                        Buyer
                    </option>

                    <option value="seller">
                        Seller
                    </option>

                    <option value="admin">
                        Admin
                    </option>

                </select>

            </div>


            <!-- Login Button -->
            <button
                type="submit"
                class="login-button">
                Login
            </button>

        </form>


        <!-- Message -->
        <div
            id="message"
            class="message">
        </div>


        <!-- Registration -->
        <div class="register-text">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </div>


        <!-- Home -->
        <a
            href="index.html"
            class="home-link">

            ← Back to Home

        </a>

    </div>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                const role =
                    document.getElementById("role").value;

                const message =
                    document.getElementById("message");


                /*
                 * TEMPORARY FRONTEND TEST
                 *
                 * Later this section will be replaced
                 * with a fetch() request to the
                 * C++ Drogon backend.
                 *
                 * C++ backend will check SQLite.
                 */


                if (email && password && role) {

                    message.style.color = "green";

                    message.innerText =
                        "Login form submitted successfully.";

                    console.log("Email:", email);
                    console.log("Role:", role);

                }

            });

    </script>

</body>

</html>
