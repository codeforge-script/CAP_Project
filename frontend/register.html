<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - JoelMart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #131921, #37475a);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            width: 450px;
            max-width: 100%;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            color: #ff9900;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .title {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #ff9900;
        }

        .register-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background-color: #ff9900;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-button:hover {
            background-color: #e68a00;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .login-text {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .login-text a,
        .home-link {
            color: #0066c0;
            text-decoration: none;
            font-weight: bold;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 15px;
        }

        .role-info {
            background-color: #f5f6f8;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 13px;
            color: #555;
        }

        @media (max-width: 500px) {
            .register-container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="logo">
            JoelMart
        </div>

        <h2 class="title">
            Create Your Account
        </h2>

        <div class="role-info">
            <strong>Registration available for:</strong><br>
            👤 Buyer &nbsp;&nbsp; 🏪 Seller
        </div>

        <form id="registerForm">

            <!-- Full Name -->
            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

            </div>


            <!-- Confirm Password -->
            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >

            </div>


            <!-- Role -->
            <div class="form-group">

                <label for="role">
                    Register As
                </label>

                <select
                    id="role"
                    name="role"
                    required>

                    <option value="">
                        Select Role
                    </option>

                    <option value="buyer">
                        Buyer
                    </option>

                    <option value="seller">
                        Seller
                    </option>

                </select>

            </div>


            <!-- Register Button -->
            <button
                type="submit"
                class="register-button">

                Create Account

            </button>

        </form>


        <!-- Message -->
        <div
            id="message"
            class="message">
        </div>


        <!-- Login -->
        <div class="login-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>


        <!-- Home -->
        <a
            href="index.html"
            class="home-link">

            ← Back to Home

        </a>

    </div>


    <script>

        document
            .getElementById("registerForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const name =
                    document.getElementById("name").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;

                const role =
                    document.getElementById("role").value;

                const message =
                    document.getElementById("message");


                /*
                 * TEMPORARY FRONTEND VALIDATION
                 *
                 * Later this form will send the
                 * registration data to the
                 * C++ Drogon backend.
                 *
                 * The backend will then save the
                 * user information into SQLite.
                 */


                if (password !== confirmPassword) {

                    message.style.color = "red";

                    message.innerText =
                        "Passwords do not match.";

                    return;
                }


                if (name && email && password && role) {

                    message.style.color = "green";

                    message.innerText =
                        "Registration form submitted successfully.";

                    console.log("Name:", name);
                    console.log("Email:", email);
                    console.log("Role:", role);

                }

            });

    </script>

</body>

</html>
